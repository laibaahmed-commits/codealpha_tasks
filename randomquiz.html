<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .quote-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .quote-text {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .quote-author {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="quote-card">
        <div class="quote-text" id="quoteText">Loading quote...</div>
        <div class="quote-author" id="quoteAuthor"></div>
        <button onclick="generateQuote()">New Quote</button>
    </div>

    <script>
        const quotes = [
            { text: "The best way to get started is to quit talking and begin doing.", author: "Walt Disney" },
            { text: "The pessimist complains about the wind; the optimist expects it to change; the realist adjusts the sails.", author: "William Arthur Ward" },
            { text: "Don't let yesterday take up too much of today.", author: "Will Rogers" },
            { text: "It's not whether you get knocked down, it's whether you get up.", author: "Vince Lombardi" },
            { text: "If you are working on something that you really care about, you don't have to be pushed. The vision pulls you.", author: "Steve Jobs" },
            { text: "Failure will never overtake me if my determination to succeed is strong enough.", author: "Og Mandino" }
        ];

        function generateQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const randomQuote = quotes[randomIndex];
            
            document.getElementById("quoteText").innerText = `"${randomQuote.text}"`;
            document.getElementById("quoteAuthor").innerText = `- ${randomQuote.author}`;
        }

        // Display a random quote when the app opens
        window.onload = generateQuote;
    </script>
</body>
</html>
